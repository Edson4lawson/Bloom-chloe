services:
  # Backend PHP API Bloom-Chloé
  - type: web
    name: bloom-chloe-api
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        sync: false # Renseigner ici l'URL fournie par Neon (postgres://user:pass@ep-xyz.neon.tech/neondb?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://bloom-chloe.vercel.app
      - key: API_URL
        value: https://bloom-chloe-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://bloom-chloe.vercel.app,https://www.bloom-chloe.com,https://bloom-chloe.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: false
